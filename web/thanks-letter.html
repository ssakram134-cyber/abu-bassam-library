<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>كتاب الشكر والتقدير</title><style>*{box-sizing:border-box}body{margin:0;background:#e9edf2;color:#222;font-family:Tahoma,Arial,sans-serif}.toolbar{position:sticky;top:0;z-index:9;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px;background:#24374a}.toolbar button,.toolbar select{min-height:41px;border:0;border-radius:9px;background:#fff;color:#24374a;font-weight:900;font-size:10px}.toolbar button.primary{background:#1f8a70;color:#fff}.workspace{padding:12px}.fields{max-width:900px;margin:0 auto 12px;display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#fff;border-radius:14px;padding:10px}.fields label{font-size:10px;font-weight:900;color:#5b6570}.fields input,.fields textarea{width:100%;margin-top:4px;border:1px solid #cdd5dd;border-radius:9px;padding:9px;background:#fff;color:#222;font:700 11px Tahoma}.fields textarea{min-height:72px;resize:vertical}.full{grid-column:1/-1}.paper-wrap{overflow:auto;padding:8px}.paper{position:relative;width:794px;min-height:1123px;margin:auto;background:#fff;padding:72px 76px 72px;box-shadow:0 10px 28px #0004;overflow:hidden}.paper:before,.paper:after{content:'';position:absolute;pointer-events:none}.paper:before{inset:22px;border:4px double #b68a3e}.paper:after{inset:35px;border:1px solid #d8c9aa}.logo{width:95px;height:95px;margin:0 auto 18px;display:grid;place-items:center;border-radius:50%;border:3px solid #b68a3e;font-size:45px}.org{text-align:center;font-weight:900;font-size:18px}.title{text-align:center;margin:30px 0 20px;font-size:34px;font-weight:900;color:#7d5417}.to{text-align:center;font-size:24px;font-weight:900;margin:20px 0}.body{font-size:20px;line-height:2.15;text-align:justify;margin-top:24px;white-space:pre-wrap}.reason{margin-top:20px;padding:15px;border-right:5px solid #b68a3e;background:#fbf7ee;font-size:18px;line-height:1.9}.footer-grid{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:55px;text-align:center;font-size:17px;line-height:1.8}.signature{font-weight:900}.date{color:#555}.designer{position:absolute;left:55px;bottom:42px;font-size:11px;color:#999}.t2 .title{color:#0b6b59}.t2:before{border-color:#0b6b59}.t2 .logo{border-color:#0b6b59}.t2 .reason{border-color:#0b6b59;background:#eef8f5}.t3{background:#fffdf8}.t3 .title{color:#7b1d2d}.t3:before{border-color:#7b1d2d}.t3 .logo{border-color:#7b1d2d}.t3 .reason{border-color:#7b1d2d;background:#fff0f2}.t4 .title{color:#244f85}.t4:before{border-color:#244f85}.t4 .logo{border-color:#244f85}.t4 .reason{border-color:#244f85;background:#f0f5fb}.t5 .title{color:#4b3b69}.t5:before{border-color:#4b3b69}.t5 .logo{border-color:#4b3b69}.t5 .reason{border-color:#4b3b69;background:#f4f0fa}.t6 .title{color:#333}.t6:before{border:5px solid #333}.t6:after{border:2px solid #c7c7c7}.t6 .logo{border-color:#333}.t6 .reason{border-color:#333;background:#f6f6f6}@media(max-width:850px){.paper-wrap{overflow:hidden}.paper{transform-origin:top center;transform:scale(.48);margin-bottom:-570px}.fields{grid-template-columns:1fr}.full{grid-column:1}.toolbar{grid-template-columns:1fr 1fr}}@media(min-width:520px) and (max-width:850px){.paper{transform:scale(.7);margin-bottom:-337px}}@media print{@page{size:A4;margin:0}body{background:#fff}.toolbar,.fields{display:none!important}.workspace,.paper-wrap{padding:0!important;overflow:visible!important}.paper{width:210mm;min-height:297mm;margin:0;box-shadow:none;transform:none!important;padding:19mm 20mm}.designer{display:none}}</style></head><body><div class="toolbar"><select id="template"><option value="t1">نموذج ذهبي رسمي</option><option value="t2">نموذج أخضر</option><option value="t3">نموذج خمري</option><option value="t4">نموذج أزرق</option><option value="t5">نموذج بنفسجي</option><option value="t6">نموذج رسمي أبيض وأسود</option></select><button class="primary" onclick="printLetter()">🖨 طباعة</button><button onclick="savePdf()">📄 حفظ PDF</button><button onclick="resetLetter()">🆕 جديد</button></div><div class="workspace"><div class="fields"><label>الجهة المانحة<input id="org" value="مدرسة القادسية الابتدائية للبنين"></label><label>عنوان الكتاب<input id="title" value="كتاب شكر وتقدير"></label><label>اسم المكرَّم<input id="recipient" value="الأستاذ / ........................"></label><label>الصفة<input id="role" value="معلم المادة"></label><label class="full">نص الشكر<textarea id="bodyText">يسرنا أن نتقدم لكم بخالص الشكر والتقدير لما بذلتموه من جهود مخلصة وعمل دؤوب، سائلين الله تعالى أن يوفقكم لمزيد من العطاء والتميز خدمةً للمسيرة التربوية.</textarea></label><label class="full">سبب الشكر أو الإنجاز<textarea id="reason">تقديراً للجهود المتميزة وحسن الأداء والتعاون.</textarea></label><label>التاريخ<input id="date" value=""></label><label>اسم وتوقيع الجهة المانحة<input id="sign" value="إدارة المدرسة"></label></div><div class="paper-wrap"><section id="paper" class="paper t1"><div class="logo">🏅</div><div id="pOrg" class="org"></div><div id="pTitle" class="title"></div><div id="pTo" class="to"></div><div id="pBody" class="body"></div><div id="pReason" class="reason"></div><div class="footer-grid"><div><div>التاريخ</div><div id="pDate" class="date"></div></div><div><div class="signature">التوقيع</div><div id="pSign"></div></div></div><div class="designer">إعداد: مكتبة أبو بسام للتصوير والقرطاسية</div></section></div></div><script>const KEY='abuBassamThanksLetterV1';const ids=['template','org','title','recipient','role','bodyText','reason','date','sign'];function q(id){return document.getElementById(id)}function read(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}}function save(show){let o={};ids.forEach(id=>o[id]=q(id).value);try{localStorage.setItem(KEY,JSON.stringify(o));if(show)alert('تم حفظ كتاب الشكر والتقدير ✓')}catch(e){}}function restore(){let s=read();if(s)ids.forEach(id=>{if(s[id]!=null)q(id).value=s[id]});if(!q('date').value){let d=new Date();q('date').value=d.toLocaleDateString('ar-IQ')}render()}function render(){q('paper').className='paper '+q('template').value;q('pOrg').textContent=q('org').value;q('pTitle').textContent=q('title').value||'كتاب شكر وتقدير';q('pTo').textContent=q('recipient').value+(q('role').value?' — '+q('role').value:'');q('pBody').textContent=q('bodyText').value;q('pReason').textContent=q('reason').value;q('pDate').textContent=q('date').value;q('pSign').textContent=q('sign').value;save(false)}function printable(){let clone=document.documentElement.cloneNode(true);clone.querySelectorAll('script,.toolbar,.fields').forEach(n=>n.remove());return '<!doctype html>'+clone.outerHTML}function printLetter(){save(false);let html=printable();try{if(parent.Android&&parent.Android.printHtml)return parent.Android.printHtml(html)}catch(e){}window.print()}function savePdf(){save(false);let html=printable(),name='Thanks_Letter_'+Date.now()+'.pdf';try{if(parent.Android&&parent.Android.savePdfHtml)return parent.Android.savePdfHtml(name,html)}catch(e){}alert('حفظ PDF متاح داخل تطبيق Android')}function resetLetter(){if(!confirm('بدء كتاب شكر وتقدير جديد؟'))return;localStorage.removeItem(KEY);location.reload()}ids.forEach(id=>q(id).addEventListener('input',render));q('template').addEventListener('change',render);restore();</script></body></html>
