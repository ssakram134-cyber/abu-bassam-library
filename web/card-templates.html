<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>نماذج الباجات والكروت</title><style>*{box-sizing:border-box}body{margin:0;padding:14px;background:#f6f0e8;color:#2b231e;font-family:Tahoma,Arial,sans-serif}.head{padding:14px;border-radius:16px;background:linear-gradient(135deg,#06483e,#087f72,#a7772e);color:#fff;margin-bottom:12px}.head h2{margin:0;font-size:18px}.head p{margin:5px 0 0;font-size:11px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{min-height:110px;border:1px solid #d9c8ba;border-radius:16px;background:#fff;color:#2d2520;font-weight:900;font-size:13px;box-shadow:0 5px 15px #00000010}.card span{display:block;font-size:34px;margin-bottom:7px}.mawkib{background:linear-gradient(145deg,#171717,#342719);color:#f0cf78;border-color:#b58a3e}.ration{background:linear-gradient(145deg,#f7f0df,#e9dbc0);color:#5b3d25;border-color:#b8925f}.note{margin-top:12px;padding:10px;border-radius:12px;background:#fff;color:#756b65;font-size:10px;line-height:1.7}@media(max-width:420px){.grid{grid-template-columns:1fr 1fr}.card{min-height:96px;font-size:11px}}</style></head><body><div class="head"><h2>🧩 نماذج الباجات والكروت</h2><p>اختر النوع الذي تريد العمل عليه.</p></div><div class="grid"><button class="card" onclick="choose('personal')"><span>🪪</span>الباج التعريفي</button><button class="card" onclick="choose('child')"><span>🎒</span>باج الروضة والمدرسة</button><button class="card ration" onclick="ration()"><span>🧾</span>البطاقة التموينية</button><button class="card mawkib" onclick="mawkib()"><span>🏴</span>كروت المواكب الحسينية</button><button class="card" onclick="choose('login')"><span>🔐</span>بطاقة تسجيل الدخول</button><button class="card" onclick="choose('wifi')"><span>📶</span>كارت Wi‑Fi</button><button class="card" onclick="choose('qr')"><span>▦</span>تكوين QR</button></div><div class="note">البطاقة التموينية وكروت المواكب لهما محرران مستقلان داخل قسم الباركود والكروت حتى تبقى النماذج والبيانات محفوظة بشكل مستقل.</div><script>function closeModal(){try{parent.document.getElementById('abuRecoveryModal').style.display='none'}catch(e){}}function choose(type){try{parent.CardsStudio.selectType(type);closeModal()}catch(e){alert('تعذر فتح النموذج')}}function openTool(title,src){try{parent.document.getElementById('abuRecoveryTitle').textContent=title;parent.document.getElementById('abuRecoveryFrame').src=src}catch(e){location.href=src}}function ration(){openTool('البطاقة التموينية','ration-card.html')}function mawkib(){openTool('كروت المواكب الحسينية','mawkib-cards.html')}</script></body></html>
