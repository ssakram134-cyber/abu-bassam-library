<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>النماذج</title><script src="card-template-library.js"></script><style>*{box-sizing:border-box}body{margin:0;padding:12px;background:#f6f0e8;color:#2b231e;font-family:Tahoma,Arial,sans-serif}.head{padding:14px;border-radius:16px;background:linear-gradient(135deg,#06483e,#087f72,#a7772e);color:#fff;margin-bottom:12px}.head h2{margin:0;font-size:18px;line-height:1.4}.head p{margin:6px 0 0;font-size:11px;line-height:1.7}.catalog{display:grid;gap:10px}.group{border:1px solid #d9c8ba;border-radius:16px;background:#fff;box-shadow:0 5px 15px #00000010;overflow:hidden}.group-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 12px;background:#fffaf4;border-bottom:1px solid #eadfd5}.group-title{display:flex;align-items:center;gap:8px;min-width:0}.group-title .icon{font-size:26px;line-height:1}.group-title b{font-size:13px;line-height:1.45;white-space:normal;overflow-wrap:anywhere}.count{flex:0 0 auto;min-width:62px;padding:5px 8px;border-radius:999px;background:#087f7214;color:#087f72;text-align:center;font-size:9px;font-weight:900}.models{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:10px}.model{width:100%;min-height:48px;border:1px solid #d9c8ba;border-radius:11px;background:#fff;color:#3d312a;padding:8px 9px;font-size:10px;font-weight:900;line-height:1.45;white-space:normal;overflow-wrap:anywhere;text-align:center}.group[data-id="mawkib"] .model{background:#201915;color:#f0cf78;border-color:#9a7336}.group[data-id="ration"] .model{background:#fff8e9;border-color:#c9a56a}.group[data-id="envelope"] .model{background:#eef6fb;border-color:#7da7c7;color:#244f85}.group[data-id="thanks"] .model{background:#fff8e6;border-color:#c49a46;color:#6d4a12}.note{margin-top:12px;padding:10px;border-radius:12px;background:#fff;color:#756b65;font-size:10px;line-height:1.8}@media(max-width:420px){body{padding:9px}.models{gap:7px;padding:8px}.model{min-height:52px;font-size:9px;padding:7px 5px}.group-title b{font-size:12px}.count{min-width:55px;font-size:8px}}@media(max-width:330px){.models{grid-template-columns:1fr}}</style></head><body><div class="head"><h2 id="catalogTitle">🧩 جميع النماذج المتفق عليها</h2><p id="catalogSubtitle">اختر النموذج مباشرة من داخل قسم الباركود والكروت.</p></div><div id="catalog" class="catalog"></div><div class="note">كل قسم يعرض نماذجه الخاصة فقط عند فتح زر «النماذج» من داخله. النصوص الطويلة تلتف داخل الأزرار بدون تداخل أو قص.</div><script>const lib=Array.isArray(window.AbuBassamCardTemplateLibrary)?window.AbuBassamCardTemplateLibrary:[];const requestedSection=decodeURIComponent((location.hash||'').replace(/^#/,''));const selectedGroup=requestedSection?lib.find(g=>g.id===requestedSection):null;const visibleLib=selectedGroup?[selectedGroup]:lib;const esc=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function closeModal(){try{parent.document.getElementById('abuRecoveryModal').style.display='none'}catch(e){}}function choose(type){try{parent.CardsStudio.selectType(type);closeModal()}catch(e){alert('تعذر فتح النموذج')}}function openRoute(title,route,model){const src=route+(model?'#'+encodeURIComponent(model):'');try{parent.document.getElementById('abuRecoveryTitle').textContent=title;parent.document.getElementById('abuRecoveryFrame').src=src}catch(e){location.href=src}}function use(g,m){if(g.type){choose(g.type);return}openRoute(g.title,g.route,m.id)}function render(){const title=document.getElementById('catalogTitle'),subtitle=document.getElementById('catalogSubtitle');if(selectedGroup){document.title='نماذج '+selectedGroup.title;title.textContent=selectedGroup.icon+' نماذج '+selectedGroup.title;subtitle.textContent='هذه النماذج تخص هذا القسم فقط.'}const host=document.getElementById('catalog');host.innerHTML=visibleLib.map((g,gi)=>'<section class="group" data-id="'+esc(g.id)+'"><div class="group-head"><div class="group-title"><span class="icon">'+esc(g.icon)+'</span><b>'+esc(g.title)+'</b></div><span class="count">'+g.models.length+' '+(g.models.length===1?'نموذج':'نماذج')+'</span></div><div class="models">'+g.models.map((m,mi)=>'<button class="model" data-g="'+gi+'" data-m="'+mi+'">'+esc(m.name)+'</button>').join('')+'</div></section>').join('');host.querySelectorAll('.model').forEach(b=>b.onclick=()=>{const g=visibleLib[Number(b.dataset.g)],m=g.models[Number(b.dataset.m)];use(g,m)})}render();</script></body></html>
