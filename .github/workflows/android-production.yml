name: Android production release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-production-main
  cancel-in-progress: false

env:
  EXPECTED_RELEASE_CERT_SHA256: 9ed30ea3d1b0faaabdb8d51b8e82c675ccdaec77c1565ffba2aefb811a528112

jobs:
  build:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
          verify-signature: true

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build and verify APK with no production secrets
        run: npm run build:apk:local

      - name: Enforce non-production build input
        shell: bash
        run: |
          set -euo pipefail
          grep -qx 'test-release-default-key-with-embedded-js-NOT-FOR-PRODUCTION-UPDATES' dist/BUILD_TYPE.txt
          mapfile -t APKS < <(find dist -maxdepth 1 -type f -name 'Abu_Bassam_Library_*.apk' -print)
          test "${#APKS[@]}" -eq 1
          test -s "${APKS[0]}"
          test -s dist/SHA256.txt
          test -s dist/SIGNING_CERTIFICATE.txt
          sha256sum -c dist/SHA256.txt

      - name: Upload verified production-signing input
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: abu-bassam-production-input-${{ github.sha }}
          path: |
            dist/*.apk
            dist/SHA256.txt
          if-no-files-found: error
          retention-days: 1

  sign:
    needs: build
    if: ${{ github.ref == 'refs/heads/main' && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Set up Java for apksigner
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
          verify-signature: true

      - name: Download verified APK input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: abu-bassam-production-input-${{ github.sha }}
          path: input

      - name: Validate isolated signing input
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find input -maxdepth 1 -type f -name 'Abu_Bassam_Library_*.apk' -print)
          test "${#APKS[@]}" -eq 1
          test -s "${APKS[0]}"
          test -s input/SHA256.txt
          (
            cd input
            sha256sum -c SHA256.txt
          )
          printf '%s' "$EXPECTED_RELEASE_CERT_SHA256" | grep -Eq '^[0-9a-f]{64}$'

      - name: Decode production signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 is missing." >&2; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/abu-bassam-release-key.p12"
          test -s "$RUNNER_TEMP/abu-bassam-release-key.p12"

      - name: Sign and verify production APK
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          for name in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            test -n "${!name:-}" || { echo "Missing production signing secret: $name" >&2; exit 1; }
          done
          mapfile -t APKS < <(find input -maxdepth 1 -type f -name 'Abu_Bassam_Library_*.apk' -print)
          test "${#APKS[@]}" -eq 1
          INPUT_APK="${APKS[0]}"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          test -n "$BUILD_TOOLS"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          test -x "$APKSIGNER"
          mkdir -p dist
          OUTPUT_APK="dist/$(basename "$INPUT_APK")"
          "$APKSIGNER" sign             --ks "$RUNNER_TEMP/abu-bassam-release-key.p12"             --ks-type PKCS12             --ks-key-alias "$ANDROID_KEY_ALIAS"             --ks-pass env:ANDROID_KEYSTORE_PASSWORD             --key-pass env:ANDROID_KEY_PASSWORD             --out "$OUTPUT_APK"             "$INPUT_APK"
          "$APKSIGNER" verify --verbose "$OUTPUT_APK"
          "$APKSIGNER" verify --print-certs "$OUTPUT_APK" > dist/SIGNING_CERTIFICATE.txt
          ACTUAL_CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' dist/SIGNING_CERTIFICATE.txt | head -n1 | tr -d ':[:space:]' | tr 'A-F' 'a-f')"
          test -n "$ACTUAL_CERT"
          if [ "$ACTUAL_CERT" != "$EXPECTED_RELEASE_CERT_SHA256" ]; then
            echo "Production signing certificate mismatch." >&2
            echo "Expected: $EXPECTED_RELEASE_CERT_SHA256" >&2
            echo "Actual:   $ACTUAL_CERT" >&2
            exit 1
          fi
          unzip -l "$OUTPUT_APK" | grep -q 'assets/index.android.bundle'
          sha256sum "$OUTPUT_APK" > dist/SHA256.txt
          printf 'signed-production-release-with-embedded-js\n' > dist/BUILD_TYPE.txt

      - name: Enforce production artifact
        shell: bash
        run: |
          set -euo pipefail
          grep -qx 'signed-production-release-with-embedded-js' dist/BUILD_TYPE.txt
          mapfile -t APKS < <(find dist -maxdepth 1 -type f -name 'Abu_Bassam_Library_*.apk' -print)
          test "${#APKS[@]}" -eq 1
          test -s "${APKS[0]}"
          test -s dist/SHA256.txt
          test -s dist/SIGNING_CERTIFICATE.txt
          sha256sum -c dist/SHA256.txt

      - name: Remove decoded signing key
        if: ${{ always() }}
        shell: bash
        run: rm -f "$RUNNER_TEMP/abu-bassam-release-key.p12"

      - name: Upload production APK artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: abu-bassam-android-production-${{ github.sha }}
          path: |
            dist/*.apk
            dist/BUILD_TYPE.txt
            dist/SHA256.txt
            dist/SIGNING_CERTIFICATE.txt
          if-no-files-found: error
          retention-days: 14
