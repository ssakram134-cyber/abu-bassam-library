name: Android production release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-production-main
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
          verify-signature: true

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Decode production signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 is missing." >&2; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/abu-bassam-release-key.p12"
          test -s "$RUNNER_TEMP/abu-bassam-release-key.p12"

      - name: Build and verify production APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/abu-bassam-release-key.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_TYPE: PKCS12
        run: npm run build:apk:release

      - name: Enforce production artifact
        shell: bash
        run: |
          set -euo pipefail
          grep -qx 'signed-production-release-with-embedded-js' dist/BUILD_TYPE.txt
          test -n "$(find dist -maxdepth 1 -type f -name 'Abu_Bassam_Library_*.apk' -print -quit)"
          test -s dist/SHA256.txt
          test -s dist/SIGNING_CERTIFICATE.txt

      - name: Remove decoded signing key
        if: ${{ always() }}
        shell: bash
        run: rm -f "$RUNNER_TEMP/abu-bassam-release-key.p12"

      - name: Upload production APK artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: abu-bassam-android-production-${{ github.sha }}
          path: |
            dist/*.apk
            dist/BUILD_TYPE.txt
            dist/SHA256.txt
            dist/SIGNING_CERTIFICATE.txt
          if-no-files-found: error
          retention-days: 14
