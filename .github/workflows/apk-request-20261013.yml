name: One-time Abu Bassam test APK - 2026-10-13

on:
  push:
    branches:
      - build/apk-20261013

permissions:
  contents: read

jobs:
  build-test-apk:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/build/apk-20261013' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout requested source revision
        uses: actions/checkout@v4

      - name: Install Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify full source before build
        run: npm run check:web

      - name: Generate Android project with embedded offline assets
        env:
          CI: '1'
        run: npm run android:prebuild

      - name: Assemble standalone test-signed release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Check bundle, signature and export test artifact
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          unzip -Z1 "$APK" | grep -Fxq 'assets/index.android.bundle'
          test "$(unzip -p "$APK" assets/index.android.bundle | wc -c)" -gt 1000
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          test -n "$BUILD_TOOLS"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          mkdir -p dist
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" > dist/SIGNING_CERTIFICATE.txt
          cp "$APK" dist/Abu_Bassam_Library_4.3.2_TEST.apk
          printf 'test-signed-release-NOT-FOR-PRODUCTION-UPDATES\n' > dist/BUILD_TYPE.txt
          sha256sum dist/Abu_Bassam_Library_4.3.2_TEST.apk > dist/SHA256.txt

      - name: Upload verified test APK
        uses: actions/upload-artifact@v4
        with:
          name: abu-bassam-test-apk-20261013-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
