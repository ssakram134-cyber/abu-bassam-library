name: Android build disabled - source repairs only

on:
  # Manual visibility only. No automatic workflow on push or pull requests.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Intentionally DISABLED: no Android builds or APK uploads in GitHub Actions.
    # Source checks remain available locally with `npm run check:web`.
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
          verify-signature: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools'

      - name: Ensure pinned Android NDK
        shell: bash
        env:
          NDK_VERSION: 27.1.12297006
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          NDK_DIR="$SDK_ROOT/ndk/$NDK_VERSION"
          CLANG="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          if test -x "$CLANG"; then
            echo "NDK $NDK_VERSION already installed and valid."
            exit 0
          fi
          for attempt in 1 2 3; do
            echo "Installing NDK $NDK_VERSION (attempt $attempt/3)..."
            rm -rf "$NDK_DIR" "$SDK_ROOT/.temp" "$HOME/.android/cache"
            if sdkmanager --install "ndk;$NDK_VERSION" --channel=0; then
              if test -x "$CLANG"; then
                echo "NDK $NDK_VERSION installed successfully."
                exit 0
              fi
            fi
            rm -rf "$NDK_DIR" "$SDK_ROOT/.temp" "$HOME/.android/cache"
            sleep $((attempt * 5))
          done
          echo "Failed to install a valid NDK $NDK_VERSION after 3 attempts." >&2
          exit 1

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Build and verify standalone test APK
        run: npm run build:apk:local

      - name: Enforce non-production artifact
        shell: bash
        run: |
          set -euo pipefail
          grep -qx 'test-release-default-key-with-embedded-js-NOT-FOR-PRODUCTION-UPDATES' dist/BUILD_TYPE.txt
          test -n "$(find dist -maxdepth 1 -type f -name 'Abu_Bassam_Library_*.apk' -print -quit)"
          test -s dist/SHA256.txt
          test -s dist/SIGNING_CERTIFICATE.txt

      - name: Upload APK artifacts
        id: upload_qa_apk
        # The APK, embedded bundle, and signature are validated above. GitHub's
        # storage quota may reject only artifact delivery; report that separately.
        continue-on-error: true
        # QA artifact for trusted same-repo PRs only; default signing key is not for production.
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: abu-bassam-android-test-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/*.apk
            dist/BUILD_TYPE.txt
            dist/SHA256.txt
            dist/SIGNING_CERTIFICATE.txt
          if-no-files-found: error
          retention-days: 7

      - name: Report QA APK delivery failure
        if: ${{ steps.upload_qa_apk.outcome == 'failure' }}
        shell: bash
        run: |
          echo '::warning title=QA APK upload unavailable::Android checks, APK build and signature verification succeeded, but GitHub artifact upload failed (possibly storage quota). No downloadable APK was published by this run.'
          echo 'QA APK delivery failed; restore artifact storage capacity before device testing.' >> "$GITHUB_STEP_SUMMARY"
