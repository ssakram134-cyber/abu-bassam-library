name: Android checks and build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_ANDROID_RELEASE_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Synchronize package lock
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: synchronize package lock"
            git push
          fi

      - name: Check web application
        run: npm run check:web

      - name: Generate Android project and copy offline assets
        env:
          CI: "1"
        run: npm run android:prebuild

      - name: Configure fallback release signing
        if: ${{ env.HAS_ANDROID_RELEASE_KEY != 'true' }}
        run: |
          test -s android/app/debug.keystore
          printf '\napply from: file("../../scripts/android-ci-debug-release-signing.gradle")\n' >> android/app/build.gradle

      - name: Configure existing release key
        if: ${{ env.HAS_ANDROID_RELEASE_KEY == 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release-key.p12
          test -s android/app/release-key.p12
          printf '\napply from: file("../../scripts/android-release-signing.gradle")\n' >> android/app/build.gradle

      - name: Build standalone release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/android/app/release-key.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_TYPE: PKCS12
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify standalone JS bundle is packaged
        shell: bash
        run: |
          APK="$(ls android/app/build/outputs/apk/release/*.apk | head -n1)"
          test -s "$APK"
          unzip -t "$APK"
          unzip -l "$APK" | grep -F 'assets/index.android.bundle'

      - name: Verify APK signature
        shell: bash
        run: |
          APK="$(ls android/app/build/outputs/apk/release/*.apk | head -n1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"

      - name: Prepare distributable APK
        shell: bash
        run: |
          APK="$(ls android/app/build/outputs/apk/release/*.apk | head -n1)"
          mkdir -p dist
          cp "$APK" "dist/Abu_Bassam_Library_4.3.2.apk"
          if [ "$HAS_ANDROID_RELEASE_KEY" = "true" ]; then
            printf 'production-signed-release\n' > dist/BUILD_TYPE.txt
          else
            printf 'debug-signed-release-standalone\n' > dist/BUILD_TYPE.txt
          fi
          printf 'assets/index.android.bundle\n' > dist/BUNDLE_VERIFIED.txt
          test -s dist/Abu_Bassam_Library_4.3.2.apk
          ls -lh dist/Abu_Bassam_Library_4.3.2.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: abu-bassam-android-${{ github.sha }}
          path: |
            dist/Abu_Bassam_Library_4.3.2.apk
            dist/BUILD_TYPE.txt
            dist/BUNDLE_VERIFIED.txt
          if-no-files-found: error
          retention-days: 14
