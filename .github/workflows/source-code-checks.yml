name: Source code checks (no APK build)

on:
  push:
    branches: [main]
    paths: &source_paths
      - '.github/workflows/**'
      - 'web/**'
      - 'tools/**'
      - 'scripts/**'
      - 'supabase/**'
      - 'config/**'
      - 'index.js'
      - 'index-auth.js'
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
      - 'eas.json'
      - 'AGENTS.md'
      - 'docs/PROJECT-MASTER-SPEC.md'
  pull_request:
    branches: [main]
    paths: *source_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout source (read-only)
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run full read-only project checks
        run: npm run check:web
