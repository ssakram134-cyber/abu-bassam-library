name: Full source audit (manual - no APK)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    # A manual review of all source checks; never assemble, sign or publish an APK.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout audited source
        uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run every regression check and list all failures
        run: npm run check:all
