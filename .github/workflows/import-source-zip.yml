name: Review source ZIP import

on:
  workflow_dispatch:
    inputs:
      source_zip:
        description: "Relative .zip path already committed to this repository"
        required: true
        default: "Abu_Bassam_Library_Source.zip"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: source-import-main
  cancel-in-progress: false

jobs:
  import-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require trusted main ref
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "Source ZIP import may run only from refs/heads/main." >&2
            exit 1
          }

      - name: Checkout trusted current repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Capture trusted validator and baseline before extraction
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/abu-trusted"
          cp tools/validate_imported_source.js "$RUNNER_TEMP/abu-trusted/validate_imported_source.js"
          sha256sum "$RUNNER_TEMP/abu-trusted/validate_imported_source.js" > "$RUNNER_TEMP/abu-trusted/validator.sha256"
          echo "ABU_TRUSTED_APP_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
          echo "ABU_TRUSTED_VERSION_CODE=$(node -p "require('./app.json').expo.android.versionCode")" >> "$GITHUB_ENV"

      - name: Preflight repository ZIP without executing imported code
        env:
          SOURCE_ZIP_INPUT: ${{ inputs.source_zip }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$SOURCE_ZIP_INPUT" "$GITHUB_WORKSPACE" "$GITHUB_ENV" <<'PY'
          import pathlib, stat, sys, zipfile

          raw_text=sys.argv[1].replace('\\','/').strip()
          workspace=pathlib.Path(sys.argv[2]).resolve()
          env_file=pathlib.Path(sys.argv[3])
          raw=pathlib.PurePosixPath(raw_text)

          if any(ord(ch)<32 or ord(ch)==127 for ch in raw_text):
              raise SystemExit('Archive rejected: source_zip contains control characters')
          if not raw_text or raw.is_absolute() or '..' in raw.parts or raw.suffix.lower()!='.zip':
              raise SystemExit(f'Archive rejected: source_zip must be a relative .zip path inside the repository: {raw_text!r}')

          candidate=workspace
          for part in raw.parts:
              candidate=candidate/part
              if candidate.is_symlink():
                  raise SystemExit(f'Archive rejected: source_zip path contains symbolic link: {raw_text!r}')

          try:
              resolved=candidate.resolve(strict=True)
          except FileNotFoundError:
              raise SystemExit(f'ZIP not found: {raw_text}')
          try:
              resolved.relative_to(workspace)
          except ValueError:
              raise SystemExit(f'Archive rejected: source_zip escapes repository workspace: {raw_text!r}')
          if not resolved.is_file():
              raise SystemExit(f'Archive rejected: source_zip is not a regular file: {raw_text!r}')

          forbidden_names={'.env','.env.local','.env.production','.npmrc','local.properties','google-services.json'}
          forbidden_ext={'.jks','.keystore','.p12','.pfx','.pem','.key'}
          count=0
          total=0
          normalized_names=set()
          with zipfile.ZipFile(resolved) as z:
              for item in z.infolist():
                  count+=1
                  if count>5000:
                      raise SystemExit('Archive rejected: more than 5000 entries')
                  if item.flag_bits & 0x1:
                      raise SystemExit(f'Archive rejected: encrypted ZIP entry {item.filename!r}')
                  name=item.filename.replace('\\','/')
                  if any(ord(ch)<32 or ord(ch)==127 for ch in name):
                      raise SystemExit(f'Archive rejected: control character in path {name!r}')
                  p=pathlib.PurePosixPath(name)
                  if not name or p.is_absolute() or '..' in p.parts:
                      raise SystemExit(f'Archive rejected: unsafe path {name!r}')
                  normalized=p.as_posix().rstrip('/')
                  if normalized in normalized_names:
                      raise SystemExit(f'Archive rejected: duplicate path {name!r}')
                  normalized_names.add(normalized)
                  mode=(item.external_attr >> 16) & 0o170000
                  if mode==stat.S_IFLNK:
                      raise SystemExit(f'Archive rejected: symbolic link {name!r}')
                  if item.file_size>100*1024*1024:
                      raise SystemExit(f'Archive rejected: file too large {name!r}')
                  total+=item.file_size
                  if total>500*1024*1024:
                      raise SystemExit('Archive rejected: uncompressed size exceeds 500 MB')
                  base=p.name.lower()
                  ext=pathlib.PurePosixPath(base).suffix.lower()
                  if base in forbidden_names or ext in forbidden_ext:
                      raise SystemExit(f'Archive rejected: secret/signing file {name!r}')

          with env_file.open('a',encoding='utf-8') as f:
              f.write(f'SOURCE_ZIP_SAFE={resolved}\n')
          print(f'ZIP preflight passed: {count} entries, {total/1024/1024:.1f} MB')
          PY

      - name: Extract into isolated directory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/abu-import"
          mkdir -p "$RUNNER_TEMP/abu-import"
          python3 - "$SOURCE_ZIP_SAFE" "$RUNNER_TEMP/abu-import" <<'PY'
          import pathlib, sys, zipfile
          src=pathlib.Path(sys.argv[1])
          dst=pathlib.Path(sys.argv[2])
          with zipfile.ZipFile(src) as z:
              z.extractall(dst)
          PY

      - name: Locate and validate imported source using trusted validator
        shell: bash
        run: |
          set -euo pipefail
          IMPORT="$RUNNER_TEMP/abu-import"
          if [ -f "$IMPORT/package.json" ] && [ -d "$IMPORT/web" ]; then
            SRC="$IMPORT"
          else
            mapfile -t candidates < <(find "$IMPORT" -mindepth 1 -maxdepth 2 -type f -name package.json -printf '%h\n' | sort -u)
            if [ "${#candidates[@]}" -ne 1 ]; then
              echo "Expected exactly one source root, found ${#candidates[@]}" >&2
              exit 1
            fi
            SRC="${candidates[0]}"
          fi
          test -d "$SRC/web" || { echo "Imported source has no web directory" >&2; exit 1; }
          echo "SOURCE_ROOT=$SRC" >> "$GITHUB_ENV"
          node "$RUNNER_TEMP/abu-trusted/validate_imported_source.js" "$SRC"

      - name: Verify lockfile without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          cd "$SOURCE_ROOT"
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Import source while preserving trusted workflow and validator boundary
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'tools/validate_imported_source.js' \
            --exclude 'node_modules/' \
            --exclude 'dist/' \
            --exclude 'android/' \
            --exclude 'ios/' \
            --exclude '*.jks' --exclude '*.keystore' --exclude '*.p12' --exclude '*.pfx' --exclude '*.pem' --exclude '*.key' \
            "$SOURCE_ROOT/" ./
          rm -rf node_modules dist android ios
          rm -f "$SOURCE_ZIP_SAFE"
          sha256sum -c "$RUNNER_TEMP/abu-trusted/validator.sha256"
          cmp -s tools/validate_imported_source.js "$RUNNER_TEMP/abu-trusted/validate_imported_source.js" || {
            echo "Trusted import validator changed during source import." >&2
            exit 1
          }
          node "$RUNNER_TEMP/abu-trusted/validate_imported_source.js" .

      - name: Create review branch
        id: branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "No source changes detected."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BRANCH="source-import-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Review imported Abu Bassam source ZIP"
          git push --set-upstream origin "$BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open pull request instead of writing to main
        if: steps.branch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.branch }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Review imported Abu Bassam source" \
            --body "Automated source import passed archive preflight and trusted static validation. The trusted workflow and validator were preserved. Review the diff first, then manually run the Android checks and test build workflow on this source-import branch before merging. This workflow never writes imported source directly to main."
